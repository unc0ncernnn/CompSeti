<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: gray;
            margin: 10px;
            display: inline-block;
        }
        .controls {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="redCircle" class="circle"></div>
    <div id="yellowCircle" class="circle"></div>
    <div id="greenCircle" class="circle"></div>

    <div class="controls">
        <button id="btnRed">Красный</button>
        <button id="btnYellow">Жёлтый</button>
        <button id="btnGreen">Зелёный</button>
    </div>

    <script>
        const red = document.querySelector('#redCircle');
        const yellow = document.querySelector('#yellowCircle');
        const green = document.querySelector('#greenCircle');

        const btnRed = document.querySelector('#btnRed');
        const btnYellow = document.querySelector('#btnYellow');
        const btnGreen = document.querySelector('#btnGreen');

        function resetColors() {
            red.style.backgroundColor = 'gray';
            yellow.style.backgroundColor = 'gray';
            green.style.backgroundColor = 'gray';
        }

        btnRed.onclick = function() {
            resetColors();
            red.style.backgroundColor = 'red';
        };

        btnYellow.onclick = function() {
            resetColors();
            yellow.style.backgroundColor = 'yellow';
        };

        btnGreen.onclick = function() {
            resetColors();
            green.style.backgroundColor = 'green';
        };
    </script>

</body>
</html>
